<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お月見AR体験</title>
    <script type="module" src="https://googleapis.com"></script>
    <style>
        body { margin: 0; background: #000; font-family: sans-serif; }
        .container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; }
        model-viewer { width: 100%; height: 100%; }
        /* 押しやすいように大きな黄色のボタンを画面下部に配置 */
        .ar-button { 
            position: absolute; bottom: 40px; z-index: 999;
            background: #ffcc00; color: #000; border: none; 
            padding: 18px 40px; font-size: 20px; font-weight: bold; 
            border-radius: 40px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- iOSでもAndroidでも自動で最適にARを開くための設定 -->
        <model-viewer 
            src="moon.glb" 
            ar 
            ar-modes="scene-viewer webxr quick-look" 
            camera-controls 
            auto-rotate 
            interaction-prompt="none">
            
            <button slot="ar-button" class="ar-button">
                🌕 タップしてARを開始する
            </button>
        </model-viewer>
    </div>

</body>
</html>
